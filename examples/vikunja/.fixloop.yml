# Example FixLoop config for the local Vikunja demo copy (branch main).
# The demo repo is not published yet; it will be uploaded later.
app:
  # --build: the Fix stage boots the app from a checkout with a new change, so the image must be rebuilt.
  up: docker compose -f docker-compose.fixloop.yml up -d --build --wait
  down: docker compose -f docker-compose.fixloop.yml down -v
  base_url: http://localhost:3456
  seed: ./scripts/fixloop-seed.sh
logs:
  - { type: docker, services: [api], compose_file: docker-compose.fixloop.yml }
tests:
  backend:
    run: go test ./{{dir}} -run ^{{name}}$
    dir: .
    new_test_glob: "pkg/**/*_test.go"
  frontend:
    run: pnpm vitest run {{file}}
    dir: frontend
    new_test_glob: "frontend/src/**/*.test.ts"
  e2e:
    # --reporter=list: the config's html reporter would serve a report and never exit on failure.
    # --retries=0: the config retries twice when CI is set.
    run: pnpm exec playwright test {{file}} -g {{name}} --reporter=list --retries=0
    dir: frontend
    new_test_glob: "frontend/tests/e2e/fixloop/*.spec.ts"
    env:
      FIXLOOP_TEST_USER: fixloop
      FIXLOOP_TEST_PASSWORD: fixloop-test-pw-1
  full: go test ./pkg/... && cd frontend && pnpm test:unit --run
areas:
  backend: ["pkg/**", "*.go"]
  frontend: ["frontend/src/**"]
risk:
  high_paths: ["pkg/models/auth*", "pkg/user/**", "pkg/migration/**"]
  max_diff_lines: 150
