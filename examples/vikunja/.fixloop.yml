# FixLoop config for the Vikunja demo repo (Amiram1/vikunja, private).
app:
  # --build: the Fix stage boots the app from a checkout with a new change, so the image must be rebuilt.
  up: docker compose -f docker-compose.fixloop.yml up -d --build --wait
  # --rmi local: each boot builds new images; removing them on teardown keeps the runner's disk from filling.
  down: docker compose -f docker-compose.fixloop.yml down -v --rmi local
  base_url: http://localhost:3456
  seed: ./scripts/fixloop-seed.sh
# Development settings: every run uses Haiku at low effort to keep API cost down.
# Before production, delete this block so the schema defaults apply (Sonnet, Opus, medium and high effort).
models:
  triage: claude-haiku-5-5
  fix: claude-haiku-5-5
  escalate: claude-haiku-5-5
effort:
  triage: low
  reproduce: low
  fix: low
  escalate: low
logs:
  - { type: docker, services: [api], compose_file: docker-compose.fixloop.yml }
tests:
  backend:
    run: go test ./{{dir}} -run ^{{name}}$
    dir: .
    new_test_glob: "pkg/**/*_test.go"
  frontend:
    run: pnpm vitest run {{file}}
    dir: frontend
    new_test_glob: "frontend/src/**/*.test.ts"
  e2e:
    # --reporter=list: the config's html reporter would serve a report and never exit on failure.
    # --retries=0: the config retries twice when CI is set.
    run: pnpm exec playwright test {{file}} -g {{name}} --reporter=list --retries=0
    dir: frontend
    new_test_glob: "frontend/tests/e2e/fixloop/*.spec.ts"
    env:
      FIXLOOP_TEST_USER: fixloop
      FIXLOOP_TEST_PASSWORD: fixloop-test-pw-1
  # The Go static-file tests embed frontend/dist, so the frontend is built first, as CI does.
  full: "(cd frontend && pnpm install --frozen-lockfile && pnpm build) && go test ./pkg/... && (cd frontend && pnpm test:unit --run)"
areas:
  backend: ["pkg/**", "*.go"]
  frontend: ["frontend/src/**"]
risk:
  high_paths: ["pkg/models/auth*", "pkg/user/**", "pkg/migration/**"]
  max_diff_lines: 150
