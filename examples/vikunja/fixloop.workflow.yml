# Workflow for the Vikunja repo. Copy to .github/workflows/fixloop.yml in the target repo.
#
# FixLoop is private, and GitHub does not let a private repo's action be called from another repo.
# So this checks FixLoop out with a token and runs its committed bundle (dist/action) directly.
# Requires a secret FIXLOOP_TOKEN in this repo: a fine-grained personal access token with
# read-only "Contents" access to Amiram1/fix-loop. Set it with:
#   gh secret set FIXLOOP_TOKEN --repo Amiram1/vikunja
#
# The reproduction and fix stages run the repo's own tests, so the runner needs the same toolchain
# CI uses: Go, Node and pnpm. Docker is included on GitHub-hosted runners.
name: FixLoop

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: fixloop-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  fixloop:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Reads the exact version from frontend/package.json's packageManager field (pnpm@11.27.0).
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      # Chromium needs system libraries on a fresh Linux runner. Installing them here keeps the
      # reproduction step from failing on launch. The runner repeats the browser install itself.
      - name: Install Playwright browser and system libraries
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Check out FixLoop
        uses: actions/checkout@v5
        with:
          repository: Amiram1/fix-loop
          token: ${{ secrets.FIXLOOP_TOKEN }}
          path: .fixloop

      - name: Run FixLoop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node .fixloop/dist/action/index.js
