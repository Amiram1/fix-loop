# Workflow for the Vikunja repo. Copy to .github/workflows/fixloop.yml in the target repo.
#
# The reproduction stage runs the repo's own tests, so the runner needs the same toolchain CI uses:
# Go (for backend tests), Node and pnpm (for frontend tests), and Docker (for the app stack),
# which GitHub-hosted runners already include.
#
# Note: `uses:` below points at the FixLoop Action. It must be a public repo or a repo in the same
# account for the call to resolve. While FixLoop is private, run this from a copy of the FixLoop repo.
name: FixLoop

on:
  issues:
    types: [opened]
  # A reporter's answer to a needs-info question, and `/fixloop retry|stop` from collaborators.
  # The Action's router decides what to do with each comment. The job-level `if` below keeps
  # unrelated comments from paying for the toolchain setup.
  issue_comment:
    types: [created]
  # A FixLoop pull request was merged or closed: the Action records the outcome in the run ledger.
  # The router ignores pull requests whose branch does not start with `fixloop/`.
  pull_request:
    types: [closed]

permissions:
  # write, not read: the ledger and journal live on the `fixloop-data` branch of this repo, and
  # the Action pushes to it (and creates it the first time) from this workflow.
  contents: write
  issues: write
  pull-requests: write

jobs:
  fixloop:
    if: >-
      github.event_name == 'issues' ||
      (github.event_name == 'pull_request' &&
      startsWith(github.event.pull_request.head.ref, 'fixloop/')) ||
      (!github.event.issue.pull_request &&
      (contains(github.event.comment.body, '/fixloop') ||
      contains(github.event.issue.labels.*.name, 'needs-info')))
    # At job level so a skipped comment does not take the slot of a queued run.
    concurrency:
      group: fixloop-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # GitHub-hosted runners have about 14 GB free. Vikunja's image build needs more, so free the
      # preinstalled toolchains this job does not use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Reads the exact version from frontend/package.json's packageManager field (pnpm@11.27.0).
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      # Chromium needs system libraries on a fresh Linux runner. Installing them here keeps the
      # reproduction step from failing on launch. The runner repeats the browser install itself.
      - name: Install Playwright browser and system libraries
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - uses: Amiram1/fix-loop@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
