# Workflow for the Vikunja repo. Copy to .github/workflows/fixloop.yml in the target repo.
#
# The reproduction stage runs the repo's own tests, so the runner needs the same toolchain CI uses:
# Go (for backend tests), Node and pnpm (for frontend tests), and Docker (for the app stack),
# which GitHub-hosted runners already include.
#
# Note: `uses:` below points at the FixLoop Action. It must be a public repo or a repo in the same
# account for the call to resolve. While FixLoop is private, run this from a copy of the FixLoop repo.
name: FixLoop

on:
  issues:
    types: [opened]
  # A reporter's answer to a needs-info question, and `/fixloop retry|stop` from collaborators.
  # The Action's router decides what to do with each comment. The job-level `if` below keeps
  # unrelated comments from paying for the toolchain setup.
  issue_comment:
    types: [created]
  # A FixLoop pull request was merged or closed: the Action records the outcome in the run ledger.
  # The router ignores pull requests whose branch does not start with `fixloop/`.
  pull_request:
    types: [closed]

permissions:
  # write, not read: the ledger and journal live on the `fixloop-data` branch of this repo, and
  # the Action pushes to it (and creates it the first time) from this workflow.
  contents: write
  issues: write
  pull-requests: write

jobs:
  # Records a FixLoop pull request's outcome in the ledger. It needs no toolchain and no model key,
  # so it is a separate, cheap job.
  outcome:
    if: >-
      github.event_name == 'pull_request' &&
      startsWith(github.event.pull_request.head.ref, 'fixloop/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Amiram1/fix-loop@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  fixloop:
    if: >-
      github.event_name == 'issues' ||
      (!github.event.issue.pull_request &&
      (contains(github.event.comment.body, '/fixloop') ||
      contains(github.event.issue.labels.*.name, 'needs-info')))
    # At job level so a skipped comment does not take the slot of a queued run.
    concurrency:
      group: fixloop-${{ github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # GitHub-hosted runners have about 14 GB free. Vikunja's image build needs more, so free the
      # preinstalled toolchains this job does not use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # pnpm first: setup-node's pnpm cache needs the pnpm binary to find the store. The version comes
      # from frontend/package.json's packageManager field (pnpm@11.27.0).
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      # Caches the pnpm store (keyed on the lockfile), so each Fix attempt's `pnpm install` reuses it.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # Caches the Go module and build caches (keyed on go.sum).
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The Playwright browser is the largest download in a run. Cached per lockfile version.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      # Chromium needs system libraries on a fresh Linux runner, so the install runs even on a cache
      # hit: the cache holds the browser, not the libraries.
      - name: Install Playwright browser and system libraries
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - uses: Amiram1/fix-loop@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
