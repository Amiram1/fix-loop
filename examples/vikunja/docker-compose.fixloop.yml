# Minimal Vikunja stack for FixLoop runs (SQLite, built from the repo's Dockerfile).
# Copied to the Vikunja repo root. Run: docker compose -f docker-compose.fixloop.yml up -d --wait
#
# The stock image runs as uid 1000 with a root-owned /app/vikunja and is FROM scratch (no wget),
# so the data paths point at /tmp and there is no container healthcheck. FixLoop checks
# readiness itself by polling app.base_url.
services:
  api:
    build:
      context: . # this file is copied to the root of the Vikunja checkout
      dockerfile: Dockerfile
    ports: ["3456:3456"]
    environment:
      VIKUNJA_SERVICE_PUBLICURL: http://localhost:3456
      VIKUNJA_SERVICE_JWTSECRET: fixloop-ci-only-secret
      VIKUNJA_DATABASE_TYPE: sqlite
      VIKUNJA_DATABASE_PATH: /tmp/vikunja.db
      VIKUNJA_FILES_BASEPATH: /tmp/files
      VIKUNJA_SERVICE_ENABLEREGISTRATION: "true"
