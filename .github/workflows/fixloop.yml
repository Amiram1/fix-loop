name: FixLoop

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: fixloop-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  fixloop:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: ./
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
